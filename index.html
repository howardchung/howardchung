<!DOCTYPE html>
<html lang="en">

<head>
    <title></title>
    <meta charset="UTF-8">
    <link href="//cdn.jsdelivr.net/bootstrap/latest/css/bootstrap.min.css" rel="stylesheet">
    <link href="//cdn.jsdelivr.net/fontawesome/latest/css/font-awesome.min.css" rel="stylesheet">
    <style>
        a {
            margin: 1px;
        }
    </style>
    <script src="//cdn.jsdelivr.net/react/latest/react.min.js"></script>
    <script src="//bpampuch.github.io/pdfmake/build/pdfmake.min.js"></script>
    <script src="//bpampuch.github.io/pdfmake/build/vfs_fonts.js"></script>
    <script src="//cdn.jsdelivr.net/momentjs/latest/moment.min.js"></script>
</head>

<body>
    <div id="react"></div>
</body>
<script>
    var React = React;
    var moment = moment;
    var pdfMake = pdfMake;
    var site = React.createClass({
        componentDidMount: function() {
            httpGet("public/data.json", function(data) {
                httpGet("https://api.github.com/users/howardc93/starred", function(projects) {
                    projects.sort(function(a, b) {
                        var key = "updated_at";
                        return new Date(b[key]) - new Date(a[key]);
                    });
                    data.projects = {
                        "heading": "Projects",
                        "content": projects
                    };
                    var sections = ["education", "positions", "projects", "skills"];
                    data.resume = {};
                    data.resume.styles = {
                        "heading": {
                            "bold": true,
                            "fontSize": 15
                        }
                    };
                    data.resume.content = [{
                        text: data.json.full_name,
                        style: "heading"
                    }, data.email, data.phone, data.links.github.url, data.url];
                    sections.forEach(function(s) {
                        data.resume.content.push({
                            text: s.heading,
                            style: "heading"
                        });
                        //TODO format section
                        data.resume.content.push(JSON.stringify(s.content));
                    });
                    this.setState({
                        data: data
                    });
                    document.title = data.json.content.full_name;
                }.bind(this));
            }.bind(this));
        },
        render: function() {
            return (React.createElement('div', {
                className: "container text-center"
            }, [
                React.createElement('h1', {}, this.state ? this.state.data.json.content.full_name : ""),
                React.createElement('img', {
                    className: "img-rounded profile",
                    src: "public/profile.jpg",
                    height: 250,
                    title: this.state ? this.state.data.profilejpg : ""
                }),
                React.createElement('small', {}, this.state ? "Did you know? " + this.state.data.facts[Math.floor(Math.random() * this.state.data.facts.length)] : ""),
                React.createElement('hr'),
                React.createElement('div', {
                    className: "panel panel-info text-left"
                }, [React.createElement('div', {
                        className: "panel-heading"
                    }, React.createElement('h3', {
                        className: "panel-title"
                    }, this.state ? this.state.data.json.heading : "")),
                        React.createElement('div', {
                        className: "panel-body"
                    }, React.createElement('pre', {}, this.state ? JSON.stringify(this.state.data.json.content, null, 2) : ""))
                    ]),
                React.createElement('div', {
                    className: "panel panel-default text-left"
                }, [React.createElement('div', {
                        className: "panel-heading"
                    }, React.createElement('h3', {
                        className: "panel-title"
                    }, this.state ? this.state.data.intro.heading : "")),
                        React.createElement('div', {
                        className: "panel-body"
                    }, this.state ? this.state.data.intro.content : "")]),
                React.createElement('div', {
                    className: "panel panel-success text-left"
                }, [React.createElement('div', {
                        className: "panel-heading"
                    }, React.createElement('h3', {
                        className: "panel-title"
                    }, this.state ? this.state.data.projects.heading : "")),
                        React.createElement('div', {
                        className: "panel-body"
                    }, React.createElement('ul', {}, this.state ? generateProjectElements(this.state.data) : []))
                    ]),
                    React.createElement('hr'),
                    React.createElement('footer', {}, React.createElement("div", {
                    className: "text-center btn-group"
                }, this.state ? generateLinkElements(this.state.data) : {}))
            ]));
        }
    });
    React.render(React.createElement(site), document.getElementById('react'));

    function httpGet(theUrl, cb) {
        var xmlHttp = new XMLHttpRequest();
        xmlHttp.open("GET", theUrl, true);
        xmlHttp.send(null);
        xmlHttp.onreadystatechange = function() {
            if (xmlHttp.readyState == 4 && xmlHttp.status == 200) {
                cb(JSON.parse(xmlHttp.responseText));
            }
        };
    }

    function fromNow(date) {
        return "updated " + moment(date).fromNow();
    }

    function generateProjectElements(data) {
        return data.projects.content.map(function(p) {
            return React.createElement('li', {}, [React.createElement('a', {
                href: p.homepage || p.html_url
            }, p.name), React.createElement('small', {}, p.description), React.createElement('span', {
                className: "label label-warning"
            }, React.createElement('a', {
                href: p.html_url
            }, p.language)), React.createElement('span', {
                className: "label label-success"
            }, fromNow(p.pushed_at))]);
        });
    }

    function generateLinkElements(data) {
        var linkElements = {};
        var input = data.links;
        for (var key in input) {
            var l = input[key];
            linkElements[key] = React.createElement('a', {
                href: l.url,
                className: "btn btn-default",
                onClick: key === "resume" ? function() {
                    pdfMake.createPdf(data.resume).open();
                } : null
            }, [React.createElement('i', {
                className: l.icon
            }), l.name]);
        }
        return linkElements;
    }
</script>

</html>
