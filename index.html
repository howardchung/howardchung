<!DOCTYPE html>
<html lang="en" ng-app="howard" ng-controller="howardController">

<head>
    <title>{{data.json.full_name}}</title>
    <meta charset="utf-8">
    <link href="//maxcdn.bootstrapcdn.com/bootstrap/latest/css/bootstrap.min.css" rel="stylesheet">
    <script src="//code.angularjs.org/snapshot/angular.min.js"></script>
    <script src="//cdn.rawgit.com/MrRio/jsPDF/master/dist/jspdf.min.js"></script>

    <script>
        angular.module('howard', []).controller('howardController', function($scope, $http) {
            $http.get("public/data.json").success(function(data) {
                console.log(data)
                $scope.data = data;
                $scope.random = data.facts[Math.floor(Math.random() * data.facts.length)];
                $scope.json = JSON.stringify(data.json, null, 4)
            });
        })
    </script>
</head>

<body>
    <div class="container">
        <div class="row text-center">
            <div class="col-md-12 text-center">
                <h1>{{data.json.full_name}}</h1>
                <img src="public/profile.jpg" alt="{{data.json.full_name}}">
                <div>
                    <blockquote style="display: inline-block;width:auto">
                        <p id="fact">{{random}}</p><small>A random fact</small>
                    </blockquote>
                </div>
            </div>
        </div>
        <div class="row text-center">
            <div class="col-md-5">
                <h2>About</h2>
                <div class="panel panel-warning text-left">
                    <div class="panel-heading">
                        <h3 class="panel-title">JSON</h3>
                    </div>
                    <div class="panel-body">
                        <pre class="text-left" id="json">{{json}}</pre>
                    </div>
                </div>
                <div class="panel panel-default text-left">
                    <div class="panel-heading">
                        <h3 class="panel-title">Links</h3>
                    </div>
                    <div class="panel-body" id="links">
                        <div ng-repeat="x in data.links"><a href="{{x.url}}" class="btn">{{x.name}}</a>
                        </div>
                    </div>
                </div>
                <div class="panel panel-info text-center">
                    <div class="panel-heading">
                        <h3 class="panel-title">Bitcoin</h3>
                    </div>
                    <div class="panel-body">
                        <p id="bitcoin">{{data.bitcoin}}</p>
                        <img src="{{'https://blockchain.info/qr?size=200&data='+data.bitcoin}}" alt="{{data.bitcoin}}">
                    </div>
                </div>
            </div>
            <div class="col-md-7" id="positions">
                <h2>Positions</h2>
                <div class='panel panel-primary text-left' ng-repeat="x in data.positions.all">
                    <div class='panel-heading'>
                        <h3 class='panel-title'>{{x.title}} ({{x.company.name}})</h3>
                    </div>
                    <div class='panel-body'>
                        <ul ng-repeat="y in x.summary">
                            <li>{{y}}</li>
                        </ul>
                    </div>
                </div>
            </div>
            <div class="col-md-7" id="projects">
                <h2>Projects</h2>
                <div class='panel panel-success text-left' ng-repeat="x in data.projects.all">
                    <div class='panel-heading'>
                        <h3 class='panel-title'>{{x.name}} <a href="{{x.url}}">({{x.url}})</a></h3>
                    </div>
                    <div class='panel-body'>
                        <ul ng-repeat="y in x.summary">
                            <li>{{y}}</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
