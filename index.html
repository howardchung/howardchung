<!DOCTYPE html>
<html lang="en">

<head>
    <title></title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="//cdn.jsdelivr.net/bootstrap/latest/css/bootstrap.min.css" rel="stylesheet">
    <link href="//cdn.jsdelivr.net/fontawesome/latest/css/font-awesome.min.css" rel="stylesheet">
<style>
.profile {
    margin: 5px;
    height: 120px;
    float: left;
}
#links a {
    margin: 1px;
}

h1 span{
    margin:5px;
}

li > a,small,span{
    margin: 2px;
}
</style>
<script src="//cdn.jsdelivr.net/react/latest/react.min.js"></script>
<script src="//cdn.jsdelivr.net/jspdf/latest/jspdf.min.js"></script>
<script src="//cdn.jsdelivr.net/momentjs/latest/moment.min.js"></script>
</head>
<body>
    <div id="container"></div>
</body>
<script>
    function httpGet(theUrl, cb) {
    var xmlHttp = new XMLHttpRequest();
    xmlHttp.open("GET", theUrl, true);
    xmlHttp.send(null);
    xmlHttp.onreadystatechange = function() {
        if (xmlHttp.readyState == 4 && xmlHttp.status == 200) {
            cb(JSON.parse(xmlHttp.responseText));
        }
    };
}

function fromNow(date) {
    return "updated " + moment(date).fromNow();
}

function generateResume(data) {
    console.log(data);
    var doc = new jsPDF();
    var y = 0;
    textWithPad(doc, 20, data.json.content.full_name);
    [data.contact.email, data.links.github.url, data.contact.url].forEach(function(f) {
        textWithPad(doc, 10, f)
    })
    textWithPad(doc, 18, data.educations.heading)
    data.educations.all.forEach(function(e) {
        textWithPad(doc, 12, [e.school_name, e.end_date.year].join())
        textWithPad(doc, 10, [e.degree, e.field_of_study].join(), 10)
    })
    textWithPad(doc, 18, data.positions.heading)
    data.positions.all.forEach(function(e) {
        textWithPad(doc, 12, [e.title, e.company.name, e.start_date.year].join())
        e.summary.forEach(function(f) {
            textWithPad(doc, 10, f, 10)
        })
    })
    textWithPad(doc, 18, data.projects.heading)
    data.projects.all.forEach(function(e) {
        textWithPad(doc, 12, [e.name, e.html_url].join(" - "))
        textWithPad(doc, 10, e.description, 10)
    })
    textWithPad(doc, 18, data.skills.heading)
    data.skills.all.forEach(function(e) {
        textWithPad(doc, 10, e.skill.name)
    })
    doc.output('dataurlnewwindow');
    
    function textWithPad(doc, size, text, indent) {
        y += size / 2
        indent = 20 + (indent || 0);
        doc.setFontSize(size)
        doc.text(indent, y, text)
    }
}

var site = React.createClass({
    componentDidMount: function() {
        httpGet("public/data.json", function(data) {
            httpGet("https://api.github.com/users/howardc93/starred", function(projects) {
                projects.sort(function(a, b) {
                    return new Date(b.created_at) - new Date(a.created_at);
                });
                data.projects = {
                    "heading": "Projects",
                    "all": projects
                };
                data.projectElements = data.projects.all.map(function(p) {
                    return React.createElement('li', {}, [React.createElement('a', {
                        href: p.homepage || p.html_url
                    }, p.name), React.createElement('small', {}, p.description), React.createElement('span', {
                        className: "label label-warning"
                    }, React.createElement('a', {
                        href: p.html_url
                    }, p.language)), React.createElement('span', {
                        className: "label label-success"
                    }, fromNow(p.pushed_at))]);
                });
                data.linkElements = {};
                for (var key in data.links) {
                    var l = data.links[key];
                    data.linkElements[key] = React.createElement('a', {
                        href: l.url,
                        className: "btn btn-default",
                        title: l.name,
                        onClick: key === "resume" ? function() {
                            generateResume(data);
                        } : null
                    }, React.createElement('i', {
                        className: l.icon
                    }));
                }
                this.setState({
                    data: data,
                    fact: data.facts[Math.floor(Math.random() * data.facts.length)]
                });
                document.title = data.json.content.full_name;
            }.bind(this));
        }.bind(this));
    },
    render: function() {
        return (
            React.createElement('div', {
                className: "container"
            }, [
                React.createElement('div', {
                        className: "row"
                    },
                    React.createElement('div', {
                        className: "col-md-12"
                    }, [
                        React.createElement('img', {
                            className: "img-rounded profile",
                            src: "public/profile.jpg",
                            title: this.state ? this.state.data.profilejpg : ""
                        }),
                        React.createElement('h1', {}, [this.state ? this.state.data.json.content.full_name : "",
                            React.createElement('small', {},
                                this.state ? this.state.fact : ""
                            )
                        ])
                    ])),
                React.createElement('hr'),
                React.createElement('div', {
                        className: "row"
                    },
                    React.createElement('div', {
                        className: "col-md-4"
                    }, React.createElement('div', {
                        className: "panel panel-info"
                    }, [React.createElement('div', {
                            className: "panel-heading"
                        }, React.createElement('h3', {
                            className: "panel-title"
                        }, this.state ? this.state.data.json.heading : "")),
                        React.createElement('div', {
                            className: "panel-body"
                        }, React.createElement('pre', {
                            className: "text-left"
                        }, this.state ? JSON.stringify(this.state.data.json.content, null, 4) : ""))
                    ])),
                    React.createElement('div', {
                        className: "col-md-8"
                    }, React.createElement('div', {
                        className: "panel panel-success"
                    }, [React.createElement('div', {
                            className: "panel-heading"
                        }, React.createElement('h3', {
                            className: "panel-title"
                        }, this.state ? this.state.data.projects.heading : "")),
                        React.createElement('div', {
                            className: "panel-body"
                        }, React.createElement('ul', {}, this.state ? this.state.data.projectElements : []))
                    ]))
                ),
                React.createElement('hr'),
                React.createElement('footer', {}, React.createElement("div", {
                    className: "text-center btn-group"
                }, this.state ? this.state.data.linkElements : {}))
            ]));
    }
});

React.render(React.createElement(site),
    document.getElementById('container')
);
</script>
</html>
