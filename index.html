<!DOCTYPE html>
<html lang="en" data-ng-app="howard" data-ng-controller="howardController">

<head>
    <title>{{data.json.content.full_name}}</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="//cdn.rawgit.com/twbs/bootstrap/master/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="//cdn.rawgit.com/FortAwesome/Font-Awesome/master/css/font-awesome.min.css" rel="stylesheet">
    <link href="howard.css" rel="stylesheet">

    <script src="//code.jquery.com/jquery-latest.min.js"></script>
    <script src="//code.angularjs.org/snapshot/angular.min.js"></script>
    <script src="//cdn.rawgit.com/twbs/bootstrap/master/dist/js/bootstrap.min.js"></script>
    <script src="//cdn.rawgit.com/MrRio/jsPDF/master/dist/jspdf.min.js"></script>
    <script src="//cdn.rawgit.com/moment/moment/develop/min/moment.min.js"></script>
    <script src="howard.js"></script>
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <img class="img-rounded profile" height=100 src="profile.jpg" alt="{{data.json.full_name}}" title="{{data.profilejpg}}">
                <h1>{{data.json.content.full_name}}
                <br>
                <small id="random"></small></h1>
            </div>
        </div>
        <hr>
        <div class="row">
            <div class="col-md-4">
                <div class="panel panel-info">
                    <div class="panel-heading">
                        <h3 class="panel-title">{{data.json.heading}}</h3>
                    </div>
                    <div class="panel-body">
                        <pre class="text-left">{{json}}</pre>
                    </div>
                </div>
            </div>
            <div class="col-md-8">
                <div class="panel panel-default">
                    <div class="panel-heading">
                        <h3 class="panel-title">{{data.intro.heading}}</h3>
                    </div>
                    <div class="panel-body">
                        <ul>
                            <li data-ng-repeat="x in data.intro.content">
                                {{x}}
                            </li>
                        </ul>
                    </div>
                </div>
                <div class="panel panel-success">
                    <div class="panel-heading">
                        <h3 class="panel-title">{{data.projects.heading}}</h3>
                    </div>
                    <div class="panel-body">
                        <ul>
                            <li data-ng-repeat="x in data.projects.all">
                                <a data-ng-href="{{x.homepage || x.html_url}}">{{x.name}}</a>
                                <small> {{x.description}}</small>
                                <span class="label label-default">{{x.language}}</span>
                                <span class="label label-success">{{x.pushed_at | fromNow}}</span>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
        <hr>
        <footer>
            <div id="links" class="text-center"></div>
        </footer>
    </div>
</body>

</html>
