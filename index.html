<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#000000">
    <link href="//cdnjs.cloudflare.com/ajax/libs/bulma/0.6.0/css/bulma.min.css" rel="stylesheet">
</head>

<body>
    <div id="react"></div>
</body>

<script src="//cdnjs.cloudflare.com/ajax/libs/react/16.0.0/umd/react.production.min.js"></script>
<script src="//cdnjs.cloudflare.com/ajax/libs/react-dom/16.0.0/umd/react-dom.production.min.js"></script>
<script>
    var React = window.React;
    var bio = `
I am a software engineer who enjoys building maintainable, reliable, and scalable systems with an emphasis on agility.

On the Bing team at Microsoft, I maintained the data ingestion services and APIs for esports-related user experiences.

I also helped pioneer the development of the first React applications on Bing, including a new tablet-optimized experience.

Previously, I worked on Azure SQL Database, where I built PowerShell commandlets for the managed backup service.

I graduated from Duke University in 2015 with a B.S. in Computer Science.

In my free time I work on various open source projects, including co-founding The OpenDota Project, a service that provides detailed data from the replay files of the ARTS game Dota 2.

It now has over 520,000 registered users and serves over 90 million API requests per month.
`;
    window.fetch('./data.json').then(function(resp) { return resp.json(); }).then(function(data) {
        document.title = data.json.full_name;
        var fact = data.facts[Math.floor(Math.random() * data.facts.length)];
        var links = React.createElement("div", {
          className: '',
        }, React.createElement('div', { className: 'field is-grouped' }, 
          data.links.map(function(l) {
            return React.createElement('p', { className: 'control' }, React.createElement('a', {
                href: l.url,
                target: '_blank',
                className: 'button is-link',
              }, [l.name]
            ));
          })
        ));
        var projects = React.createElement('ul', { className: '' }, 
          data.projects.content.map(function(project) { 
            return React.createElement('li', {}, `${(project.start_date && project.start_date.year)} - ${(project.end_date && project.end_date.year) || 'Present'} - ${project.name} - ${project.title}`);
          })
        );
        var img = React.createElement('img', {
            className: '',
            src: './profile.jpg',
            style: { height: '250px', width: 'initial', padding: '10px' },
        });
        var App = React.createElement('div', { className: 'tile is-ancestor'}, [
          React.createElement('div', { className: 'tile is-vertical is-8' }, [
            React.createElement('div', { className: 'tile'}, [
              React.createElement('div', { className: 'tile is-parent is-vertical'}, [
                React.createElement('article', { className: 'tile is-child notification is-primary'}, [
                  React.createElement('p', { className: 'title' }, data.json.full_name),
                  React.createElement('p', { className: 'subtitle' }, data.projects.content[0].title + ", " + data.projects.content[0].name),
                  links,
                  React.createElement('figure', { className: 'image' }, img),
                ]),
                React.createElement('article', { className: 'tile is-child notification is-warning'}, [
                  React.createElement('p', { className: 'title' }, fact),
                  React.createElement('p', { className: 'subtitle' }, 'A random fact'),
                ])
              ]),
              React.createElement('div', { className: 'tile is-parent'}, [
                React.createElement('article', { className: 'tile is-child notification is-info'}, [
                  React.createElement('p', { className: 'title' }, 'Bio'),
                  React.createElement('p', { className: 'subtitle' }, 'A verbal summary'),
                  React.createElement('div', {}, 
                    React.createElement('pre', { style: { whiteSpace: 'pre-wrap' }}, bio)
                  ),
                ]),
              ]),
            ]),
            React.createElement('div', { className: 'tile is-parent'}, [
              React.createElement('article', { className: 'tile is-child notification is-danger'}, [
                React.createElement('p', { className: 'title' }, 'Timeline'),
                React.createElement('p', { className: 'subtitle' }, 'Things I\'ve done'),
                projects,
              ]),
            ]),
          ]),
          React.createElement('div', { className: 'tile is-parent'}, [
            React.createElement('article', { className: 'tile is-child notification is-success'}, [
              React.createElement('p', { className: 'title' }, 'JSON'),
              React.createElement('p', { className: 'subtitle' }, 'A parseable summary'),
              React.createElement('div', { }, 
                React.createElement('pre', {}, JSON.stringify(data.json, null, 2))
              ),
            ]),
          ]), 
        ]);
        window.ReactDOM.render(App, document.getElementById('react'));
      });
</script>
</html>
