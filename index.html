<!DOCTYPE html>
<html lang="en" data-ng-app="howard" data-ng-controller="howardController">

<head>
    <title>{{data.json.full_name}}</title>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1">

    <script src="//code.jquery.com/jquery-latest.min.js"></script>
    <script src="//code.angularjs.org/snapshot/angular.min.js"></script>

    <link href="//cdn.rawgit.com/twbs/bootstrap/master/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="//cdn.rawgit.com/FortAwesome/Font-Awesome/master/css/font-awesome.min.css" rel="stylesheet">

    <script src="//cdn.rawgit.com/MrRio/jsPDF/master/dist/jspdf.min.js"></script>

    <script src="howard.js"></script>
    <link href="howard.css" rel="stylesheet">

</head>

<body>
    <div class="container">
        <div class="row">
            <img class="profile img-rounded" src="profile.jpg" alt="{{data.json.full_name}}">
            <h1>{{data.json.full_name}} <small>{{random}}</small></h1>
            <a data-ng-href="#" id="resume" class="btn btn-success resume"><i class="fa fa-file"></i></a>
            <span data-ng-repeat="x in data.links">
                <a data-ng-href="{{x.url}}" class="btn btn-default"><i class="{{x.icon}}"></i></a>
            </span>
        </div>
        <hr>
        <div class="row">
            <div class="col-md-6">
                <div class="panel panel-info">
                    <div class="panel-heading">
                        <h3 class="panel-title">{{data.welcome.heading}}</h3>
                    </div>
                    <div class="panel-body">
                        <ul>
                            <li data-ng-repeat="x in data.welcome.content">{{x}}</li>
                        </ul>
                        <p>
                            <pre class="text-left">{{json}}</pre>
                        </p>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="panel panel-warning">
                    <div class="panel-heading">
                        <h3 class="panel-title">{{data.positions.heading}}</h3>
                    </div>
                    <div class="panel-body">
                        <ul>
                            <li data-ng-repeat="x in data.positions.all">{{x.title}}, {{x.company.name}}</li>
                        </ul>
                    </div>
                </div>

                <div class="panel panel-success">
                    <div class="panel-heading">
                        <h3 class="panel-title">{{data.projects.heading}}</h3>
                    </div>
                    <div class="panel-body">
                        <ul>
                            <li data-ng-repeat="x in data.projects.all">
                                <a data-ng-href="{{x.url}}">{{x.name}}</a>
                                <ul data-ng-repeat="y in x.summary">
                                    <li>{{y}}</li>
                                </ul>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>

        </div>
    </div>
    <hr>
    <div class="text-center">
        <p>{{data.bitcoin.heading}}: {{data.bitcoin.address}}</p>
        <img src="data:image/gif;base64,R0lGODlhAQABAIAAAP///wAAACH5BAEAAAAALAAAAAABAAEAAAICRAEAOw==" data-ng-src="https://blockchain.info/qr?size=100&amp;data={{data.bitcoin.address}}" alt="{{data.bitcoin.address}}">
    </div>
    </div>
</body>

</html>
