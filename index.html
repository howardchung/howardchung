<!DOCTYPE html>
<html lang="en" ng-app="howard" ng-controller="howardController">

<head>
    <title>{{data.json.full_name}}</title>
    <meta charset="utf-8">
    <meta name="viewport" , content="initial-scale=1">
    <link href="//cdn.rawgit.com/twbs/bootstrap/master/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="//code.jquery.com/jquery-latest.min.js"></script>
    <script src="//code.angularjs.org/snapshot/angular.min.js"></script>
    <script src="//cdn.rawgit.com/MrRio/jsPDF/master/dist/jspdf.min.js"></script>
    <script src="howard.js"></script>
</head>

<body>
    <div class="container">
        <nav class="navbar navbar-default" role="navigation">
            <div class="container-fluid">
                <div class="navbar-header">
                    <button type="button" class="navbar-toggle collapsed" data-toggle="collapse" data-target="#navbar" aria-expanded="false" aria-controls="navbar">
                        <span class="sr-only">Toggle navigation</span>
                        <span class="icon-bar"></span>
                        <span class="icon-bar"></span>
                        <span class="icon-bar"></span>
                    </button>
                    <a class="navbar-brand" href="">{{data.json.full_name}}</a>
                </div>
                <div id="navbar" class="navbar-collapse collapse">
                    <ul class="nav navbar-nav">
                        <li ng-repeat="x in data.links"><a href="{{x.url}}">{{x.name}}</a>
                        </li>
                    </ul>
                    <ul class="nav navbar-nav navbar-right">
                        <li>
                            <p class="navbar-btn">
                                <a href="#" id="resume" class="btn btn-success">
                                Generate PDF Resume
                            </a>
                            </p>
                        </li>
                    </ul>
                </div>
                <!--/.nav-collapse -->
            </div>
            <!--/.container-fluid -->
        </nav>
        <hr>
        <div class="row">
            <div class="col-md-6">
                <h2>About</h2>
                <div class="panel panel-default">
                    <div class="panel-heading">
                        <h3 class="panel-title">Welcome!</h3>
                    </div>
                    <div class="panel-body text-center">
                        <p ng-repeat="x in data.welcome">{{x}}</p>
                        <img src="public/profile.jpg" style="width:200px;" alt="{{data.json.full_name}}">
                        <div>
                        <blockquote style="display: inline-block;width:auto">
                            <p id="fact">{{random}}</p><small>A random fact</small>
                        </blockquote>
                        </div>
                    </div>
                </div>
                <div class="panel panel-warning">
                    <div class="panel-heading">
                        <h3 class="panel-title">JSON</h3>
                    </div>
                    <div class="panel-body">
                        <pre id="json">{{json}}</pre>
                    </div>
                </div>
                <div class="panel panel-info">
                    <div class="panel-heading">
                        <h3 class="panel-title">Bitcoin</h3>
                    </div>
                    <div class="panel-body text-center">
                        <p id="bitcoin">{{data.bitcoin}}</p>
                        <img src="https://blockchain.info/qr?size=200&data={{data.bitcoin}}" alt="{{data.bitcoin}}">
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <h2>Positions</h2>
                <div class='panel panel-primary' ng-repeat="x in data.positions.all">
                    <div class='panel-heading'>
                        <h3 class='panel-title'>{{x.title}} ({{x.company.name}})</h3>
                    </div>
                    <div class='panel-body'>
                        <ul ng-repeat="y in x.summary">
                            <li>{{y}}</li>
                        </ul>
                    </div>
                </div>
                <h2>Projects</h2>
                <div class='panel panel-success' ng-repeat="x in data.projects.all">
                    <div class='panel-heading'>
                        <h3 class='panel-title'>{{x.name}} <a href="{{x.url}}">({{x.url}})</a></h3>
                    </div>
                    <div class='panel-body'>
                        <ul ng-repeat="y in x.summary">
                            <li>{{y}}</li>
                        </ul>
                    </div>
                </div>

            </div>
        </div>
    </div>
</body>
<hr>

</html>
