<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="A personal website."/>
    <link href="//cdnjs.cloudflare.com/ajax/libs/bulma/0.6.0/css/bulma.min.css" rel="stylesheet">
</head>

<body>
    <div id="react"></div>
</body>

<script src="//cdnjs.cloudflare.com/ajax/libs/react/16.0.0/umd/react.production.min.js"></script>
<script src="//cdnjs.cloudflare.com/ajax/libs/react-dom/16.0.0/umd/react-dom.production.min.js"></script>
<script>
    var React = window.React;
    window.fetch('./data.json').then(function(resp) { return resp.json(); }).then(function(data) {
        document.title = data.full_name;
        var fact = data.facts[Math.floor(Math.random() * data.facts.length)];
        var links = React.createElement("div", {
          className: '',
        }, React.createElement('div', { className: 'field is-grouped' }, 
          data.links.map(function(l) {
            return React.createElement('p', { className: 'control' }, React.createElement('a', {
                href: l.url,
                target: '_blank',
                className: 'button is-link',
              }, [l.name]
            ));
          })
        ));
        var projects = React.createElement('ul', { className: '' }, 
          data.projects.content.map(function(project) { 
            return React.createElement('li', {}, [
              React.createElement('span', { className: 'tag' + ((project.end_date && project.end_date.year) ? ' is-info' : ' is-success'), style: { minWidth: '100px' }}, `${(project.start_date && project.start_date.year)} - ${(project.end_date && project.end_date.year) || ''}`),
              React.createElement('span', {}, ' '),
              React.createElement('a', { href: project.url, target: '_blank' }, `${project.name}`),
              React.createElement('span', {}, ' - '),
              React.createElement('span', {}, `${project.title}`)
            ]);
          })
        );
        var sides = React.createElement('ul', {}, 
          data.sides.content.map(function(side) {
            return React.createElement('li', {}, 
              React.createElement('a', { href: side.url }, side.name)
            );
          })
        );
        var img = React.createElement('img', {
            className: '',
            src: './profile.jpg',
            style: { height: '250px', width: 'initial', padding: '10px' },
        });
        var fact = [
          React.createElement('p', { className: 'title' }, fact),
        ];
        var sideContent = [
          React.createElement('p', { className: 'title' }, data.sides.title),
          React.createElement('p', { className: 'subtitle' }, data.sides.subtitle),
          sides,
        ];
        var projectContent = [
          React.createElement('p', { className: 'title' }, data.projects.title),
          React.createElement('p', { className: 'subtitle' }, data.projects.subtitle),
          projects,
        ];
        var json = {
          full_name: data.full_name,
          phone: data.phone,
          email: data.email,
          url: data.url,
          gender: data.gender,
          height_cm: data.height_cm,
          right_handed: data.right_handed,
          hand_span_cm: data.hand_span_cm,
          shoe_size: data.shoe_size,
          birth_time: data.birth_time,
          birth_city: data.birth_city,
          languages: data.languages,
          activities: data.activities,
          skills: data.skills
        };
        var App = React.createElement('div', { className: 'tile is-ancestor'}, [
          React.createElement('div', { className: 'tile is-vertical is-8' }, [
            React.createElement('div', { className: 'tile'}, [
              React.createElement('div', { className: 'tile is-parent is-vertical'}, [
                React.createElement('article', { className: 'tile is-child notification is-primary'}, [
                  React.createElement('p', { className: 'title' }, data.full_name),
                  React.createElement('p', { className: 'subtitle' }, data.projects.content[0].title + ", " + data.projects.content[0].name),
                  links,
                  React.createElement('figure', { className: 'image' }, img),
                ]),
                React.createElement('article', { className: 'tile is-child notification is-warning'}, projectContent)
              ]),
              React.createElement('div', { className: 'tile is-parent'}, [
                React.createElement('article', { className: 'tile is-child notification is-info'}, [
                  React.createElement('p', { className: 'title' }, data.bio.title),
                  React.createElement('p', { className: 'subtitle' }, data.bio.subtitle),
                  React.createElement('div', {}, 
                    React.createElement('p', { className: 'is-size-6 box', style: { whiteSpace: 'pre-wrap' }}, data.bio.content.join('\n\n'))
                  ),
                ]),
              ]),
            ]),
            React.createElement('div', { className: 'tile is-parent'}, [
              React.createElement('article', { className: 'tile is-child notification is-danger'}, sideContent),
            ]),
          ]),
          React.createElement('div', { className: 'tile is-parent'}, [
            React.createElement('article', { className: 'tile is-child notification is-success'}, [
              React.createElement('p', { className: 'title' }, data.json.title),
              React.createElement('p', { className: 'subtitle' }, data.json.subtitle),
              React.createElement('div', { }, 
                React.createElement('pre', { style: { background: 'black', color: 'white' } }, JSON.stringify(json, null, 2))
              ),
            ]),
          ]), 
        ]);
        window.ReactDOM.render(App, document.getElementById('react'));
      });
</script>
</html>
