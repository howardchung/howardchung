<!DOCTYPE html>
<html lang="en">
<head>
<title>Howard Chung</title>
<meta charset="utf-8">
<link href="//maxcdn.bootstrapcdn.com/bootswatch/3.2.0/darkly/bootstrap.min.css" rel="stylesheet">
<link href="//maxcdn.bootstrapcdn.com/font-awesome/4.2.0/css/font-awesome.min.css" rel="stylesheet">
<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.3.1/angular.min.js"></script>
<script>
    function howardController($scope, $http) {
$http.get("public/data.json")
.success(function(response) {
    data=JSON.parse(response)
    console.log(data)
    $scope.data = data;
    $scope.random = Math.floor(Math.random() * data.facts.length);
});
}

</script>
</head>

<body ng-app="" ng-controller="howardController">
<div class="container">
    <div class="row text-center">
        <div class="col-md-12 text-center">
            <h1>{{data.json.full_name}}</h1>
            <img src="public/profile.jpg" alt="{{data.json.full_name}}">
            <div>
                <blockquote style="display: inline-block;width:auto">
                    <p id="fact">{{random}}</p><small>A random fact</small>
                </blockquote>
            </div>
        </div>
    </div>
    <div class="row text-center">
        <div class="col-md-5">
            <h2>About</h2>
            <div class="panel panel-warning text-left">
                <div class="panel-heading">
                    <h3 class="panel-title">JSON</h3>
                </div>
                <div class="panel-body"><pre class="text-left" id="json">
                    {{JSON.stringify(data.json, null, 4)}}
                </pre>
                </div>
            </div>
            <div class="panel panel-default text-left">
                <div class="panel-heading">
                    <h3 class="panel-title">Links</h3>
                </div>
                <div class="panel-body" id="links">
                <div ng-repeat="x in data.links"><a href="{{x.url}}" class="btn"><i class="{{x.icon}}"></i>{{x.name}}</a></div>
                </div>
            </div>
            <div class="panel panel-info text-center">
                <div class="panel-heading">
                    <h3 class="panel-title">Bitcoin</h3>
                </div>
                <div class="panel-body">
                    <p id="bitcoin"></p>
                    <img src="https://blockchain.info/qr?data=13XHeLLVeFtqef7WD4BDL3fQRqpVTUdG3i&amp;size=200" alt="13XHeLLVeFtqef7WD4BDL3fQRqpVTUdG3i">
                </div>
            </div>
        </div>
        <div class="col-md-7" id="positions">
            <h2>Positions</h2>
           </div>
        <div class="col-md-7" id="projects">
            <h2>Projects</h2>
        </div>
    </div>
</div>
</body>
</html>
