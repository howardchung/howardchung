  <body>

 <div class="navbar navbar-inverse navbar-fixed-top">

        <div class="container">
          <a href="." class="brand">Facebook Friend Network Visualizer</a>

    <div class="container">
     

   
<div id="fb-root"></div>

  <script>
 window.fbAsyncInit = function() {
    // init the FB JS SDK
    FB.init({
      appId      : '317752955022107',                        // App ID from the app dashboard
      status     : true,                                 // Check Facebook Login status
      cookie : true,
      xfbml      : true                                  // Look for social plugins on the page
    });

    FB.getLoginStatus(function(response) {
  if (response.status === 'connected') {
    doStuff();
  }
 });

FB.Event.subscribe('auth.login', function(response){
window.location.reload();
});
  };

  // Load the SDK asynchronously
  (function(d, s, id){
     var js, fjs = d.getElementsByTagName(s)[0];
     if (d.getElementById(id)) {return;}
     js = d.createElement(s); js.id = id;
     js.src = "http://connect.facebook.net/en_US/all.js";
     fjs.parentNode.insertBefore(js, fjs);
   }(document, 'script', 'facebook-jssdk'));


function doStuff(){
  document.getElementById("wait").innerHTML="Wait for it...";

    var graph = {};

   FB.api('/me/friends', function(response) {
    console.log(response);
    // Construct a mapping of IDs to friends (we might want this later).
    var friends = response.data.reduce(function(acc, x) {
        acc[x.id] = x.name;
        return acc;
    }, {});

    // Extract the list of friend IDs.
    var fids = Object.keys(friends);

    // Add some nodes to the graph.
    var nodes = fids.map(function(fid) {
        return {
            id:     fid,
            name:   friends[fid]
        }
    });

FB.api({
    method: 'fql.query',
    query: 'SELECT uid1, uid2 FROM friend WHERE uid1 IN (SELECT uid2 FROM friend WHERE uid1=me()) AND uid2 IN (SELECT uid2 FROM friend WHERE uid1=me())'},
    function(response) {
        // Build a list of edges from the relations. D3.js needs us to store
        // them as indexes of nodes in the nodes list.
        var links = response.map(function(rel) {
            return {
                source: fids.indexOf(rel.uid1),
                target: fids.indexOf(rel.uid2)
            };
        });

console.log(nodes);
console.log(links);

var color = d3.scale.category10();
var width = 900;
var height = 900;
// Create a force layout to display nodes.
var force = d3.layout.force()
    .size([width, height])
    .charge(-25)
    .linkDistance(15);

var svg = d3.select("#visualization").append("svg")
  .attr("width", width)
  .attr("height", height);

      //add the tooltips
var div = d3.select("#visualization").append("div")   
  .attr("class", "tooltip")               
  .style("opacity", 0);

force
      .nodes(nodes)
      .links(links);

  var link = svg.selectAll(".link")
      .data(links)
    .enter().append("line")
      .attr("class", "link");

// define the nodes
var node = svg.selectAll("node")
  .data(nodes)
  .enter()
  .append("g")
    .attr("class", "node")
    .call(force.drag); 

node
    .append("circle")
    .style("fill", function(d) { return color(d.id%10); })
    .attr("r", 4);

//add names
node.on("mouseover", function(d) {
            div.transition()        
                .duration(200)      
                .style("opacity", .9);      
            div.html(d.name)  
                .style("left", (d3.event.pageX) + "px")     
                .style("top", (d3.event.pageY - 28) + "px");
            })                  
        .on("mouseout", function(d) {       
            div.transition()        
                .duration(500)      
                .style("opacity", 0);   
        });

  force.on("tick", function() {
    link.attr("x1", function(d) { return d.source.x; })
        .attr("y1", function(d) { return d.source.y; })
        .attr("x2", function(d) { return d.target.x; })
        .attr("y2", function(d) { return d.target.y; });

    node
        .attr("transform", function(d) { return "translate(" + d.x + "," + d.y + ")"; });
  });

  force.start();
document.getElementById("wait").innerHTML="";

});

});


}
</script>
